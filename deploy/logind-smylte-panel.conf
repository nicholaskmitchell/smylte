# systemd-logind drop-in for the Smylte desk panel. Installed by panel-setup.sh
# to /etc/systemd/logind.conf.d/50-smylte-panel.conf, unless SMYLTE_PANEL_KEY
# in /etc/default/smylte-panel is off.
#
# The key is the desk unit's only input, and by default logind powers the box
# off on a single press. The panel service reads the key itself instead.
# Applies with `systemctl reload systemd-logind`.
# With this file, the key does nothing at all while smylte-panel.service is
# not running.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
