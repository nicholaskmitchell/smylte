# Device-level smoke checks for the Android client, on an emulator: a debug
# build is installed and driven with adb through first launch, the app lock and
# the start-up failure screen (.github/emulator/smoke.py says what each check
# shows; android/README.md, "On an emulator", says it in words).
#
# A workflow of its own, not a job in ci.yml, on purpose. ci.yml is the gate for
# the autopull deploy, and an emulator on a shared runner is the flakiest thing
# CI can run: a red run here must never hold a deploy back. Nothing here is
# signed or published and no secret is used: the build is the debug build,
# signed with the throwaway key Gradle makes on the runner.
name: Android emulator

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/emulator/**'
      - '.github/workflows/android-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/emulator/**'
      - '.github/workflows/android-emulator.yml'
  # By hand: Actions, "Android emulator", Run workflow.
  workflow_dispatch:

# Read-only, as in ci.yml: Gradle, its plugins and the SDK's tools all run
# here, and nothing needs to write anywhere. Artifacts upload with the
# runner's own token, not this one.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run in progress.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Emulator, API ${{ matrix.api }}
    # Pinned: ubuntu-latest is moving to 26.04, and KVM for the emulator and
    # the SDK's layout are what this relies on, as they are on 24.04.
    runs-on: ubuntu-24.04
    # Building ~5 min with a cold cache, the SDK and the boot ~8, the checks
    # ~10 (check 7 waits out the app lock's 5 minutes and 30 seconds). The
    # first runs took about 11 minutes in all. The limit leaves room
    # for the boot and checks steps' own limits (20 and 30) on top of the
    # build, and for the stop and the upload after them.
    timeout-minutes: 70
    strategy:
      # Which Android version fails is the diagnosis; fail-fast throws it away.
      fail-fast: false
      matrix:
        # 30 is Android 11, the app's minSdk, where the Recents guard is
        # FLAG_SECURE and Back reaches onBackPressed. 35 is Android 15, which
        # has the 13-and-later behaviour (OnBackInvokedCallback, no secure
        # window once unlocked) on a mature google_apis image. google_apis, not
        # google_apis_playstore: the Play images refuse adb root.
        api: [30, 35]
    env:
      API_LEVEL: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Where the diagnostics go
        run: |
          echo "SMYLTE_DIAG=$RUNNER_TEMP/smylte-emulator" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/smylte-emulator"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The parsers the checks rely on, on fixture text: seconds, and a broken
      # parser shows here rather than as a puzzling failure on the emulator.
      - name: Unit tests for the smoke checks' parsers
        run: |
          python -m py_compile .github/emulator/smoke.py .github/emulator/smoke_lib.py
          python -m unittest discover -s .github/emulator -p 'test_*.py' -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ./gradlew runs gradle-wrapper.jar before anything else does.
      - name: The Gradle wrapper is Gradle's
        working-directory: android
        run: ./check-gradle-wrapper.sh

      - name: Build the debug APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug
          ls -l build/outputs/apk/debug/

      # GitHub's documented step for hardware-accelerated Android emulators:
      # opens /dev/kvm to the runner's user.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator
        timeout-minutes: 20
        env:
          # The emulator's documented software renderer (`emulator -help-gpu`);
          # the first thing to change if the emulator will not start.
          EMULATOR_GPU: software
        run: .github/emulator/boot.sh

      - name: Smoke checks
        timeout-minutes: 30
        run: >-
          python .github/emulator/smoke.py
          --apk android/build/outputs/apk/debug/smylte-android-debug.apk
          --diag "$SMYLTE_DIAG"
          --api "$API_LEVEL"

      # Before the upload, so that logcat-all.txt and emulator.log stop growing.
      - name: Stop the emulator
        if: always()
        timeout-minutes: 2
        run: |
          timeout 30 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
          for name in logcat emulator; do
            pid_file="$SMYLTE_DIAG/$name.pid"
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Upload the diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-api${{ matrix.api }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/smylte-emulator
          retention-days: 5
          if-no-files-found: warn
