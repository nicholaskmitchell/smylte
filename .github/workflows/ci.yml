# Gate for the autopull deploy: main only ever receives commits that passed the
# full backend suite (against a real scratch Radicale), the frontend unit +
# rendering tests, a typecheck + build, and the security checks (dependency
# audits on both stacks and bandit static analysis on the backend).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Declared, and read-only. Nothing here publishes anything — every job installs
# and runs third-party code (`npm ci` runs install scripts for the whole
# dependency tree; NuGet restore and `pip install` do the equivalent), and
# `actions/checkout` leaves the token in `.git/config` by default. With no
# `permissions:` key at all the effective grant was whatever the REPOSITORY
# default happened to be — a setting no reviewer of this file can see, and one
# an admin can widen without a commit. On a `pull_request` from a fork the token
# is read-only regardless, but a push build is not a fork build.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Start scratch Radicale
        # The container runs as uid 1000; the runner user is 1001, so open up the
        # bind mount enough for both (and for the cache-drop test to delete files).
        run: |
          mkdir -p scratch/data/collections
          chmod -R 0777 scratch/data
          docker compose -f scratch/docker-compose.yml up -d --build --wait
      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run tests
        run: python -m pytest
        working-directory: backend
        env:
          SCRATCH_STORAGE: ${{ github.workspace }}/scratch/data/collections
          # Without this the gate this job advertises is unenforceable: conftest's
          # `_scratch_up` turns ANY probe failure into a skip, so a container that
          # starts and answers the anonymous healthcheck but rejects the test
          # credentials silently converts ~240 tests — every DAV round-trip, sync,
          # concurrency and MCP test — into skips, and pytest still exits 0.
          # SCRATCH_REQUIRED makes that a failure here while leaving a laptop with
          # no Docker free to skip.
          SCRATCH_REQUIRED: '1'
      - name: Audit backlog status
        # The backlog pins (docs/STAGES.md) already ran above — an xfail is not
        # a failure and an XPASS already failed the step. This re-runs just them
        # to print the itemised state, so a reviewer can see which findings are
        # still open without reading the whole log.
        if: always()
        run: python -m pytest -m backlog -rxX --no-header -q
        working-directory: backend
        env:
          SCRATCH_STORAGE: ${{ github.workspace }}/scratch/data/collections
          SCRATCH_REQUIRED: '1'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + rendering tests (vitest)
        run: npm test
      - run: npm run build

  desktop:
    # The Windows client is compiled by CI and never on a user's machine, so
    # without this gate a break would only surface when a release was cut.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build desktop/Smylte.Desktop/Smylte.Desktop.csproj -c Release
      - name: Client unit tests
        # Smylte.Desktop.Tests targets plain net8.0 and *links* the sources it
        # covers, so it needs no Windows Desktop runtime pack and runs on any
        # runner. It covers the two places in the client where a mistake is a
        # security bug (the static-file traversal guard and the cookie rewriter)
        # and the two ways a failed update used to cost someone a working build.
        run: dotnet test desktop/Smylte.Desktop.Tests/Smylte.Desktop.Tests.csproj

  workflows:
    # desktop-release.yml's publish step is the only code here that hands
    # something to the outside world, and it is shell that never runs on a PR —
    # it fires on a push to main, straight at the real release. Its bad day is
    # also not a red build: a transient between the asset upload and the notes
    # edit leaves `desktop-latest` green and half-updated. So the step is tested
    # against a stub `gh`, reading the `run:` block out of the YAML so the thing
    # under test cannot drift from the thing that ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish-step tests (stubbed gh)
        run: |
          pip install --quiet pyyaml
          .github/workflows/tests/publish-release.test.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python dependencies (pip-audit)
        # Resolves requirements.txt in an isolated venv and checks the whole
        # tree against the vulnerability databases. Fails on any known CVE.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Static security analysis (bandit)
        # Medium+ severity fails the build. Known-safe sites (allowlisted
        # column names in store.py) carry reviewed `# nosec` annotations.
        run: |
          pip install bandit
          bandit -r tasksd -ll
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
