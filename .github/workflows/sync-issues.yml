name: Sync issues with GitLab
# gitlab-home template 2026-11-04c (`gitlab-home update` merges newer versions into this file)
# Dry runs and backfills are named apart, so a sweep can tell which earlier runs covered changes.
run-name: ${{ inputs.dry_run && 'Sync issues with GitLab (dry run)' || inputs.mode == 'backfill' && 'Sync issues with GitLab (backfill)' || github.event.issue.title || 'Sync issues with GitLab' }}

# Two-way sync of issues, and of pull request conversations, between this repo
# and its canonical GitLab project.
#
# Issues:
#   - New issues on either side get a mirror on the other.
#   - Comments are copied both ways; edits to a comment are copied too, and a
#     deleted comment's copy says so.
#   - Open/closed state, and each label, follow whichever side changed them last.
#   - Title and description belong to the side the issue was opened on; edit
#     them there (edits to a mirror's text are overwritten).
#   - Confidential GitLab issues and internal notes are never copied.
#   - The two sides number issues differently, so "#12" in copied text becomes
#     the other side's number for a linked issue, or a link back to the source.
# Pull requests (each has a GitLab merge request from the branch gh-pr-N, made
# by "Sync PR to GitLab"):
#   - Comments, reviews and line comments are copied both ways, edits included
#     (only those made after PR_SYNC_SINCE). GitHub review comments arrive with
#     the next run, as they don't start one themselves.
#   - Closing the merge request on GitLab closes the pull request.
#   - GitLab CI results for the pull request's latest commit show on GitHub as
#     the "GitLab CI" check.
# Releases are copied both ways, for tags the two sides have at the same commit
# (tags are never created or moved here: the push mirror copies them):
#   - A release made on GitLab is copied to GitHub, its files listed as links,
#     and the copy is deleted when the GitLab release is.
#   - A release made on GitHub is copied to GitLab, with links to its files.
#   - Edit a release where it was made: its copy is rewritten when it changes.
#     If each side has its own release for a tag, GitHub's is copied over GitLab's.
#
# Every run reconciles everything updated since the last successful sweep (and at
# least the last few hours) on both sides, so missed runs, and outages of any
# length, are caught up by the next one. GitLab starts a run through a project
# webhook that calls this workflow's workflow_dispatch endpoint; the daily
# schedule is the safety net.
#
# Pairing is recorded in hidden markers (<!-- issue-sync:... -->). Markers are
# only trusted in text written by the sync's own bot accounts, and markers in
# anything a person writes are made inert before it is copied.

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: "sweep (default) or backfill (link issues imported before sync was set up)"
        type: choice
        options: [sweep, backfill]
        default: sweep
      dry_run:
        description: "Print what would change without changing anything"
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * *"

permissions:
  issues: write
  pull-requests: write  # comments on pull requests, and closing them
  statuses: write       # the "GitLab CI" check
  contents: write       # copying GitLab releases to GitHub (and reading tags)
  actions: read         # when the last successful sweep ran

concurrency:
  group: issue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PATH: ${{ vars.GITLAB_PATH }}
      GITLAB_FORMER_BOT_IDS: ${{ vars.GITLAB_FORMER_BOT_IDS }}
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      WINDOW_HOURS: ${{ github.event_name == 'schedule' && '26' || '3' }}
      # Issues created before this are only synced once linked (see backfill).
      SYNC_SINCE: "2026-10-03T00:00:00Z"
      # Pull request comments and reviews from before this aren't copied.
      PR_SYNC_SINCE: "2026-11-04T00:00:00Z"
    steps:
      # One script, run as three steps: a failure in one doesn't stop the others,
      # and each catches up from the last run in which it succeeded.
      - name: Prepare
        run: |
          cat > "$RUNNER_TEMP/sync.py" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          GL_ROOT = "https://gitlab.com/api/v4"
          GL_PATH = os.environ["GITLAB_PATH"]
          GL_API = GL_ROOT + "/projects/" + urllib.parse.quote(GL_PATH, safe="")
          GL_WEB = "https://gitlab.com/" + GL_PATH
          GH_API = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          GH_WEB = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          GH_BOT = "github-actions[bot]"
          MODE = os.environ.get("MODE") or "sweep"
          DRY = os.environ.get("DRY_RUN") == "1"
          WINDOW = dt.timedelta(hours=float(os.environ.get("WINDOW_HOURS") or 3))
          EPOCH = dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc)
          LIMIT = 60000  # GitHub caps issue and comment bodies at 65536 chars

          GL_HEADERS = {"PRIVATE-TOKEN": os.environ["GITLAB_TOKEN"]}
          GH_HEADERS = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "issue-sync",
          }


          def ts(value):
              return dt.datetime.fromisoformat(value.replace("Z", "+00:00"))


          SINCE = ts(os.environ["SYNC_SINCE"])
          PR_SINCE = ts(os.environ.get("PR_SYNC_SINCE") or "2026-11-04T00:00:00Z")
          CI_CONTEXT = "GitLab CI"


          def q(text):
              return urllib.parse.quote(str(text), safe="")


          # ---------- HTTP ----------

          def call(method, url, headers, body=None, missing_ok=False):
              data = None if body is None else json.dumps(body).encode()
              hdrs = dict(headers)
              if data is not None:
                  hdrs["Content-Type"] = "application/json"
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method, headers=hdrs)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          raw = resp.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as err:
                      if err.code in (404, 410) and missing_ok:
                          return None
                      if err.code in (429, 500, 502, 503, 504) and attempt < 3:
                          time.sleep(5 * (attempt + 1))
                          continue
                      detail = err.read().decode(errors="replace")[:300]
                      sys.exit(f"{method} {url.split('?')[0]} -> HTTP {err.code}: {detail}")


          def with_params(url, params):
              return url + ("?" + urllib.parse.urlencode(params) if params else "")


          def gl(method, path, body=None, params=None, missing_ok=False):
              return call(method, with_params(GL_API + path, params), GL_HEADERS, body, missing_ok)


          def gh(method, path, body=None, params=None, missing_ok=False):
              return call(method, with_params(GH_API + path, params), GH_HEADERS, body, missing_ok)


          def pages(fn, path, params=None):
              out, page = [], 1
              while True:
                  batch = fn("GET", path, params=dict(params or {}, per_page=100, page=page)) or []
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1


          CHANGES = []


          def write(fn, method, path, body, what):
              CHANGES.append(what)
              print(("[dry run] " if DRY else "") + what)
              return None if DRY else fn(method, path, body)


          # ---------- markers and text ----------

          MARK_RE = re.compile(r"^<!-- issue-sync:([a-z-]+)=([0-9a-f]+) -->$", re.M)


          def mark(key, value):
              return f"<!-- issue-sync:{key}={value} -->"


          def marks(text):
              found = {}
              # Text saved from a form on github.com has CRLF line ends, which "$" doesn't match.
              for key, value in MARK_RE.findall((text or "").replace("\r\n", "\n")):
                  found.setdefault(key, []).append(value)
              return found


          def inert(text):
              """Copied text must not carry markers, pings or hidden HTML."""
              text = (text or "").replace("\r\n", "\n").replace("<!--", "&lt;!--")
              return re.sub(r"@(?=[A-Za-z0-9_.-])", "@​", text)


          def quote(text):
              text = inert(text).strip()
              if not text:
                  return "> _(no text)_"
              lines = text.split("\n")
              return "\n".join(("> " + line) if line.strip() else ">" for line in lines)


          def clip(text):
              return text if len(text) <= LIMIT else text[:LIMIT] + "\n\n_(truncated)_"


          def gl_links(text):
              """GitLab upload links are relative; make them work elsewhere."""
              return re.sub(r"\]\(/uploads/", lambda m: "](" + GL_WEB + "/uploads/", text or "")


          def one_line(text):
              return " ".join((text or "").split())


          def src_hash(title, body):
              return hashlib.sha1(((title or "") + "\0" + (body or "")).encode()).hexdigest()[:16]


          def first(text, key):
              values = marks(text).get(key)
              return values[0] if values else None


          # ---------- who wrote what ----------

          GL_BOT_ID = call("GET", GL_ROOT + "/user", GL_HEADERS)["id"]
          # A re-created token (after a project transfer, say) comes with a new bot
          # user. The bots that ran this sync before are listed in the repository
          # variable GITLAB_FORMER_BOT_IDS, so their markers stay trusted and the
          # issues and comments they mirrored stay linked instead of being copied again.
          GL_BOT_IDS = {GL_BOT_ID} | {int(x) for x in re.findall(r"\d+", os.environ.get("GITLAB_FORMER_BOT_IDS") or "")}


          def is_gl_bot(obj):
              return (obj.get("author") or {}).get("id") in GL_BOT_IDS


          def login(obj):
              return (obj.get("user") or {}).get("login") or "ghost"


          def gl_notes(iid):
              return pages(gl, f"/issues/{iid}/notes", {"sort": "asc", "order_by": "created_at"})


          def gh_comments(number):
              return pages(gh, f"/issues/{number}/comments")


          # ---------- pairing ----------

          def gl_linked_gh(issue, notes):
              """GitHub number paired with this GitLab issue, from bot-written markers."""
              if is_gl_bot(issue) and first(issue.get("description"), "gh-issue"):
                  return int(first(issue.get("description"), "gh-issue"))
              for note in notes:
                  if is_gl_bot(note) and not note.get("system") and first(note.get("body"), "gh-issue"):
                      return int(first(note.get("body"), "gh-issue"))
              return None


          def gh_linked_gl(issue, comments):
              """GitLab iid paired with this GitHub issue, from bot-written markers."""
              if login(issue) == GH_BOT and first(issue.get("body"), "gl-issue"):
                  return int(first(issue.get("body"), "gl-issue"))
              for comment in comments:
                  if login(comment) == GH_BOT and first(comment.get("body"), "gl-issue"):
                      return int(first(comment.get("body"), "gl-issue"))
              # Issues imported before sync are linked from the GitLab side only.
              twin = gl("GET", f"/issues/{issue['number']}", missing_ok=True)
              if twin and gl_linked_gh(twin, gl_notes(twin["iid"])) == issue["number"]:
                  return twin["iid"]
              return None


          # ---------- references ----------
          # GitHub numbers issues and pull requests together, GitLab numbers issues
          # and merge requests apart, so the same number means different things on
          # the two sides. Copied text gets the other side's number for a linked
          # issue (and for a pull request's merge request), and a link back to the
          # source for anything else.

          # Code, and links someone already wrote, are left as they are.
          KEEP_RE = re.compile(r"(```.*?```|~~~.*?~~~|`[^`\n]*`|!?\[[^\]\n]*\]\([^)\n]*\))", re.S)
          QUAL_REF_RE = re.compile(r"(?<![\w./-])([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)([#!])(\d+)\b")
          REF_RE = re.compile(r"(?<![\w/&#!.-])(?<!\]\()([#!])(\d+)\b")
          REF_LOOKUPS = 30  # per text; past that, references become plain links back
          REF_CACHE = {}


          def gh_ref_on_gl(number):
              """What GitHub's #number should say on GitLab; None leaves it as written."""
              item = gh("GET", f"/issues/{number}", missing_ok=True)
              if not item:
                  return None
              if "pull_request" in item:
                  # Only this project's merge requests: a fork can use a branch named like ours.
                  mrs = [m for m in gl("GET", "/merge_requests",
                                       params={"source_branch": f"gh-pr-{number}", "state": "all", "per_page": 100}) or []
                         if m.get("source_project_id") == m.get("target_project_id")]
                  return f"!{mrs[0]['iid']}" if mrs else f"[#{number}]({item['html_url']})"
              iid = gh_linked_gl(item, gh_comments(number))
              return f"#{iid}" if iid is not None else f"[#{number}]({item['html_url']})"


          def gl_ref_on_gh(sigil, number):
              """What GitLab's #number or !number should say on GitHub; None leaves it."""
              if sigil == "!":
                  mr = gl("GET", f"/merge_requests/{number}", missing_ok=True)
                  if not mr:
                      return None
                  pr = re.fullmatch(r"gh-pr-(\d+)", mr.get("source_branch") or "")
                  if pr and mr.get("source_project_id") == mr.get("target_project_id"):
                      return f"#{pr.group(1)}"
                  return f"[!{number}]({mr['web_url']})"
              gli = gl("GET", f"/issues/{number}", missing_ok=True)
              if not gli:
                  return None
              if not gli.get("confidential"):
                  linked = gl_linked_gh(gli, gl_notes(number))
                  if linked is not None:
                      return f"#{linked}"
              return f"[#{number}]({gli['web_url']})"


          def refs(text, side):
              """References in text written on side ("gh" or "gl"), as the other side needs them."""
              lookups = [REF_LOOKUPS]

              def link_back(sigil, number):
                  if side == "gh":
                      return f"[#{number}]({GH_WEB}/issues/{number})"
                  return f"[{sigil}{number}]({GL_WEB}/-/{'issues' if sigil == '#' else 'merge_requests'}/{number})"

              def plain(m):
                  sigil, number = m.group(1), int(m.group(2))
                  if side == "gh" and sigil == "!":
                      return m.group(0)
                  key = (side, sigil, number)
                  if key not in REF_CACHE:
                      if lookups[0] <= 0:
                          return link_back(sigil, number)
                      lookups[0] -= 1
                      try:
                          REF_CACHE[key] = gh_ref_on_gl(number) if side == "gh" else gl_ref_on_gh(sigil, number)
                      except (SystemExit, Exception) as err:  # a failed lookup must not stop the sync
                          print(f"Couldn't look up {sigil}{number} ({err}); linking back instead")
                          REF_CACHE[key] = link_back(sigil, number)
                  return REF_CACHE[key] or m.group(0)

              def qualified(m):
                  path, sigil, number = m.groups()
                  if side == "gh":
                      return m.group(0) if sigil == "!" else f"[{m.group(0)}](https://github.com/{path}/issues/{number})"
                  kind = "issues" if sigil == "#" else "merge_requests"
                  return f"[{m.group(0)}](https://gitlab.com/{path}/-/{kind}/{number})"

              parts = KEEP_RE.split(text or "")
              for i in range(0, len(parts), 2):
                  parts[i] = REF_RE.sub(plain, QUAL_REF_RE.sub(qualified, parts[i]))
              return "".join(parts)


          # ---------- rendering ----------

          def render_on_gl(ghi, src):
              text = clip(f"**`{login(ghi)}`** opened this issue on GitHub: {ghi['html_url']}\n\n"
                          + quote(refs(ghi.get("body"), "gh")))
              return f"{text}\n\n{mark('gh-issue', ghi['number'])}\n{mark('src', src)}"


          def render_on_gh(gli, src):
              who = inert(one_line(gli["author"]["name"]))
              text = clip(f"**{who}** (`{gli['author']['username']}`) opened this issue on GitLab: "
                          f"{gli['web_url']}\n\n" + quote(gl_links(refs(gli.get("description"), "gl"))))
              return f"{text}\n\n{mark('gl-issue', gli['iid'])}\n{mark('src', src)}"


          # ---------- creating mirrors ----------

          def create_on_gl(ghi):
              src = src_hash(ghi["title"], ghi.get("body"))
              made = write(gl, "POST", "/issues",
                           {"title": ghi["title"][:255], "description": render_on_gl(ghi, src)},
                           f"GitLab: open mirror of GitHub issue {ghi['number']}")
              if not made:
                  return None
              write(gh, "POST", f"/issues/{ghi['number']}/comments",
                    {"body": f"Tracked on GitLab: {made['web_url']}\n"
                             f"Comments on either side are copied to the other.\n\n"
                             f"{mark('gl-issue', made['iid'])}"},
                    f"GitHub issue {ghi['number']}: link to GitLab issue {made['iid']}")
              return made["iid"]


          def create_on_gh(gli):
              src = src_hash(gli["title"], gli.get("description"))
              made = write(gh, "POST", "/issues",
                           {"title": gli["title"], "body": render_on_gh(gli, src)},
                           f"GitHub: open mirror of GitLab issue {gli['iid']}")
              if not made:
                  return None
              write(gl, "POST", f"/issues/{gli['iid']}/notes",
                    {"body": f"Mirrored to GitHub: {made['html_url']}\n\n{mark('gh-issue', made['number'])}"},
                    f"GitLab issue {gli['iid']}: link to GitHub issue {made['number']}")
              return made["number"]


          # ---------- copying comments ----------
          # A copy carries its source's marker (gh-comment=ID, gl-note=ID, ...) and a
          # hash of the source's text (src=...), so later runs update the copy when
          # the source is edited and mark it when the source is deleted. Copies made
          # before the hash was added have no src marker and are left as they are, and
          # only copies by this run's own bot can be edited.

          def text_hash(text):
              return hashlib.sha1((text or "").replace("\r\n", "\n").encode()).hexdigest()[:16]


          def source(key, sid, raw, header, side, bare=False):
              """A comment to copy: marker key and id, its text, the line that introduces
              it, the side it was written on ("gh"/"gl"); bare: no "(no text)" if empty."""
              return {"key": key, "id": int(sid), "raw": raw or "", "header": header, "side": side, "bare": bare}


          def render_copy(s):
              if s["bare"] and not s["raw"].strip():
                  text = s["header"]
              elif s["side"] == "gh":
                  text = s["header"] + "\n\n" + quote(refs(s["raw"], "gh"))
              else:
                  text = s["header"] + "\n\n" + quote(gl_links(refs(s["raw"], "gl")))
              return f"{clip(text)}\n\n{mark(s['key'], s['id'])}\n{mark('src', text_hash(s['raw']))}"


          def tombstone(body, where):
              keep = [line for line in (body or "").replace("\r\n", "\n").split("\n")
                      if MARK_RE.fullmatch(line) and not line.startswith("<!-- issue-sync:deleted=")]
              return "\n".join([f"_(The comment copied here was deleted on {where}.)_", ""] + keep + [mark("deleted", 1)])


          def copies_made(items, by_bot, keys):
              """{(key, source id): copy} for the copies the sync's bots made."""
              index = {}
              for item in items:
                  if by_bot(item):
                      found = marks(item.get("body"))
                      for key in keys:
                          for value in found.get(key, []):
                              index.setdefault((key, int(value)), item)
              return index


          def copy_comments(label, sources, copies, post, edit, may_edit, where):
              """Copy new comments, update copies whose source was edited, and mark
              copies whose source was deleted (where: the side the sources are on)."""
              wanted = set()
              for s in sources:
                  wanted.add((s["key"], s["id"]))
                  made = copies.get((s["key"], s["id"]))
                  if made is None:
                      post(render_copy(s), f"{label}: {where} {s['key']} {s['id']} copied")
                  elif (may_edit(made) and not first(made.get("body"), "deleted")
                        and first(made.get("body"), "src") not in (None, text_hash(s["raw"]))):
                      edit(made, render_copy(s), f"{label}: copy of {where} {s['key']} {s['id']} updated")
              for (key, sid), made in copies.items():
                  if ((key, sid) not in wanted and may_edit(made) and first(made.get("body"), "src")
                          and not first(made.get("body"), "deleted")):
                      edit(made, tombstone(made.get("body"), where),
                           f"{label}: copy of {where} {key} {sid} marked deleted")


          def gl_own(item):
              return (item.get("author") or {}).get("id") == GL_BOT_ID


          def gh_own(item):
              return login(item) == GH_BOT


          def copyable_note(note):
              return not (note.get("system") or note.get("internal") or note.get("confidential") or is_gl_bot(note))


          def safe_path(path):
              """A file path for a header line. It comes from the contributor's branch, and git
              allows any character in one: keep it to one inert line with no backticks."""
              return inert(one_line(path)).replace("`", "'")[:200]


          def note_header(note, url):
              who = inert(one_line(note["author"]["name"]))
              pos = note.get("position") or {}
              path, line = pos.get("new_path") or pos.get("old_path"), pos.get("new_line") or pos.get("old_line")
              where = f" on `{safe_path(path)}`" + (f" line {int(line)}" if line else "") if note.get("type") == "DiffNote" and path else ""
              return f"**{who}** (`{note['author']['username']}`) commented{where} on GitLab: {url}"


          # ---------- labels ----------
          # A label on one side only is added to the other side, unless the other side
          # removed it more recently than this side added it, in which case it is removed
          # here too. Only people's changes count: the sync's own label changes are copies.
          # Names are compared ignoring case, as GitHub does. Labels are best effort: a
          # label that can't be written is reported and skipped, without failing the run.

          GH_LABEL_MAX = 50  # GitHub's limit (GitLab allows longer names)


          def sync_labels(label, number, iid, ghi, gli, gh_events):
              on_gh = {lab["name"].lower(): lab["name"] for lab in ghi.get("labels") or []}
              on_gl = {name.lower(): name for name in gli.get("labels") or []}
              differ = sorted(k for k in on_gh.keys() ^ on_gl.keys() if "," not in k)
              if not differ:
                  return
              ev_gh = [(e["label"]["name"].lower(), "add" if e["event"] == "labeled" else "remove", ts(e["created_at"]))
                       for e in gh_events() if e.get("event") in ("labeled", "unlabeled") and e.get("label")
                       and (e.get("actor") or {}).get("login") != GH_BOT]
              ev_gl = [(e["label"]["name"].lower(), e["action"], ts(e["created_at"]))
                       for e in pages(gl, f"/issues/{iid}/resource_label_events")
                       if e.get("label") and e.get("action") in ("add", "remove")
                       and (e.get("user") or {}).get("id") not in GL_BOT_IDS]

              def latest(events, key, action):
                  return max((t for n, a, t in events if n == key and a == action), default=EPOCH)

              def best_effort(fn, *args):
                  try:
                      write(fn, *args)
                  except (SystemExit, Exception) as err:  # noqa: BLE001
                      if CHANGES and CHANGES[-1] == args[-1]:
                          CHANGES.pop()  # it didn't happen
                      print(f"::warning::{args[-1]}: not done: {err}")

              for key in differ:
                  on_github = key in on_gh
                  name = on_gh[key] if on_github else on_gl[key]
                  added = latest(ev_gh if on_github else ev_gl, key, "add")
                  removed = latest(ev_gl if on_github else ev_gh, key, "remove")
                  if removed > added:
                      if on_github:
                          best_effort(gh, "DELETE", f"/issues/{number}/labels/{q(name)}", None,
                                      f"{label}: label {name} removed on GitHub to match GitLab")
                      else:
                          best_effort(gl, "PUT", f"/issues/{iid}", {"remove_labels": name},
                                      f"{label}: label {name} removed on GitLab to match GitHub")
                  elif on_github:
                      best_effort(gl, "PUT", f"/issues/{iid}", {"add_labels": name}, f"{label}: label {name} added on GitLab")
                  elif len(name) > GH_LABEL_MAX:
                      print(f"{label}: label {name} is too long for GitHub; not copied")
                  else:
                      best_effort(gh, "POST", f"/issues/{number}/labels", {"labels": [name]}, f"{label}: label {name} added on GitHub")


          # ---------- reconciling a pair ----------

          def gh_state_time(events):
              return max((ts(e["created_at"]) for e in events if e.get("event") in ("closed", "reopened")),
                         default=EPOCH)


          def gl_state_time(iid):
              events = pages(gl, f"/issues/{iid}/resource_state_events")
              return max((ts(e["created_at"]) for e in events if e.get("state") in ("closed", "reopened")),
                         default=EPOCH)


          def reconcile(number, iid):
              ghi = gh("GET", f"/issues/{number}", missing_ok=True)
              gli = gl("GET", f"/issues/{iid}", missing_ok=True)
              if not ghi or not gli:
                  print(f"GitHub {number} / GitLab {iid}: one side was deleted; leaving the other alone")
                  return
              if gli.get("confidential"):
                  print(f"GitLab issue {iid} is confidential; not syncing it")
                  return
              ghc = gh_comments(number)
              gln = gl_notes(iid)
              label = f"GitHub {number} / GitLab {iid}"
              cache = []

              def gh_events():  # fetched at most once, and only if needed
                  if not cache:
                      cache.append(pages(gh, f"/issues/{number}/events"))
                  return cache[0]

              # Title and description: the side the issue was opened on wins.
              if is_gl_bot(gli):
                  src = src_hash(ghi["title"], ghi.get("body"))
                  if first(gli.get("description"), "src") != src:
                      write(gl, "PUT", f"/issues/{iid}",
                            {"title": ghi["title"][:255], "description": render_on_gl(ghi, src)},
                            f"{label}: GitLab mirror text updated")
              elif login(ghi) == GH_BOT:
                  src = src_hash(gli["title"], gli.get("description"))
                  if first(ghi.get("body"), "src") != src:
                      write(gh, "PATCH", f"/issues/{number}",
                            {"title": gli["title"], "body": render_on_gh(gli, src)},
                            f"{label}: GitHub mirror text updated")

              # State: whichever side changed it most recently wins.
              gh_open, gl_open = ghi["state"] == "open", gli["state"] == "opened"
              if gh_open != gl_open:
                  if gh_state_time(gh_events()) > gl_state_time(iid):
                      write(gl, "PUT", f"/issues/{iid}", {"state_event": "reopen" if gh_open else "close"},
                            f"{label}: GitLab {'reopened' if gh_open else 'closed'} to match GitHub")
                  else:
                      body = {"state": "open" if gl_open else "closed"}
                      if not gl_open:
                          body["state_reason"] = "completed"
                      write(gh, "PATCH", f"/issues/{number}", body,
                            f"{label}: GitHub {'reopened' if gl_open else 'closed'} to match GitLab")

              sync_labels(label, number, iid, ghi, gli, gh_events)

              # Comments, both ways. Markers say what was already copied; the
              # baselines cover comments that existed before the pair was linked.
              base_gh = base_gl = 0
              for note in gln:
                  if is_gl_bot(note):
                      found = marks(note.get("body"))
                      base_gh = max([base_gh] + [int(v) for v in found.get("baseline-gh", [])])
                      base_gl = max([base_gl] + [int(v) for v in found.get("baseline-gl", [])])
              copy_comments(
                  label,
                  [source("gh-comment", c["id"], c.get("body"), f"**`{login(c)}`** commented on GitHub: {c['html_url']}", "gh")
                   for c in ghc if login(c) != GH_BOT and c["id"] > base_gh],
                  copies_made(gln, is_gl_bot, ["gh-comment"]),
                  lambda body, what: write(gl, "POST", f"/issues/{iid}/notes", {"body": body}, what),
                  lambda note, body, what: write(gl, "PUT", f"/issues/{iid}/notes/{note['id']}", {"body": body}, what),
                  gl_own, "GitHub")
              copy_comments(
                  label,
                  [source("gl-note", n["id"], n.get("body"), note_header(n, f"{GL_WEB}/-/issues/{iid}#note_{n['id']}"), "gl")
                   for n in gln if copyable_note(n) and n["id"] > base_gl],
                  copies_made(ghc, gh_own, ["gl-note"]),
                  lambda body, what: write(gh, "POST", f"/issues/{number}/comments", {"body": body}, what),
                  lambda c, body, what: write(gh, "PATCH", f"/issues/comments/{c['id']}", {"body": body}, what),
                  gh_own, "GitLab")


          # ---------- pull requests ----------

          def own_mr(mr):
              # Only this project's merge requests: a fork can use a branch named like ours.
              return mr.get("source_project_id") == mr.get("target_project_id")


          def newest_mr(number):
              """The merge request "Sync PR to GitLab" made for pull request number (the newest, if reopened)."""
              mrs = [m for m in gl("GET", "/merge_requests", params={"source_branch": f"gh-pr-{number}",
                                                                     "state": "all", "per_page": 100}) or [] if own_mr(m)]
              return max(mrs, key=lambda m: m["iid"]) if mrs else None


          def reconcile_pr(number):
              mr = newest_mr(number)
              pr = gh("GET", f"/pulls/{number}", missing_ok=True)
              if not mr or not pr:
                  return
              iid = mr["iid"]
              label = f"PR {number} / MR !{iid}"

              # Closing the merge request on GitLab (not merging it) closes the pull
              # request, unless the pull request was reopened since, or the sync's own
              # bot closed it (because the pull request was closed: a quick close and
              # reopen on GitHub can finish in that order).
              if (mr["state"] == "closed" and pr["state"] == "open" and mr.get("closed_at")
                      and (mr.get("closed_by") or {}).get("id") not in GL_BOT_IDS):
                  opened = max([ts(pr["created_at"])] + [ts(e["created_at"]) for e in pages(gh, f"/issues/{number}/events")
                                                         if e.get("event") == "reopened"])
                  if ts(mr["closed_at"]) > opened:
                      write(gh, "POST", f"/issues/{number}/comments",
                            {"body": f"The merge request for this pull request was closed on GitLab, so it is closed here too: {mr['web_url']}"},
                            f"{label}: note that GitLab closed it")
                      write(gh, "PATCH", f"/pulls/{number}", {"state": "closed"}, f"{label}: pull request closed to match GitLab")

              ghc = gh_comments(number)
              gln = pages(gl, f"/merge_requests/{iid}/notes", {"sort": "asc", "order_by": "created_at"})
              from_gh = [source("gh-comment", c["id"], c.get("body"),
                                f"**`{login(c)}`** commented on GitHub: {c['html_url']}", "gh")
                         for c in ghc if login(c) != GH_BOT and ts(c["created_at"]) >= PR_SINCE]
              for c in pages(gh, f"/pulls/{number}/comments"):
                  if login(c) == GH_BOT or ts(c["created_at"]) < PR_SINCE:
                      continue
                  line = c.get("line") or c.get("original_line")
                  verb = "replied" if c.get("in_reply_to_id") else "commented"
                  from_gh.append(source("gh-review-comment", c["id"], c.get("body"),
                                        f"**`{login(c)}`** {verb} on `{safe_path(c.get('path') or '')}`" + (f" line {int(line)}" if line else "")
                                        + f" on GitHub: {c['html_url']}", "gh"))
              verbs = {"APPROVED": "approved this", "CHANGES_REQUESTED": "requested changes", "COMMENTED": "reviewed this",
                       "DISMISSED": "reviewed this (since dismissed)"}
              for r in pages(gh, f"/pulls/{number}/reviews"):
                  if (login(r) == GH_BOT or r.get("state") not in verbs or not r.get("submitted_at")
                          or ts(r["submitted_at"]) < PR_SINCE):
                      continue
                  if r["state"] == "COMMENTED" and not (r.get("body") or "").strip():
                      continue  # just a wrapper around line comments, which are copied themselves
                  from_gh.append(source("gh-review", r["id"], r.get("body"),
                                        f"**`{login(r)}`** {verbs[r['state']]} on GitHub: {r['html_url']}", "gh", bare=True))
              copy_comments(
                  label, from_gh, copies_made(gln, is_gl_bot, ["gh-comment", "gh-review-comment", "gh-review"]),
                  lambda body, what: write(gl, "POST", f"/merge_requests/{iid}/notes", {"body": body}, what),
                  lambda note, body, what: write(gl, "PUT", f"/merge_requests/{iid}/notes/{note['id']}", {"body": body}, what),
                  gl_own, "GitHub")
              copy_comments(
                  label,
                  [source("gl-note", n["id"], n.get("body"), note_header(n, f"{mr['web_url']}#note_{n['id']}"), "gl")
                   for n in gln if copyable_note(n) and ts(n["created_at"]) >= PR_SINCE],
                  copies_made(ghc, gh_own, ["gl-note"]),
                  lambda body, what: write(gh, "POST", f"/issues/{number}/comments", {"body": body}, what),
                  lambda c, body, what: write(gh, "PATCH", f"/issues/comments/{c['id']}", {"body": body}, what),
                  gh_own, "GitLab")


          CI_STATES = {"success": ("success", "passed"), "failed": ("failure", "failed"),
                       "canceled": ("error", "was canceled"), "running": ("pending", "is running"),
                       "pending": ("pending", "is waiting for a runner"),
                       "waiting_for_resource": ("pending", "is waiting for a resource"),
                       "preparing": ("pending", "is preparing")}


          def sync_ci():
              """GitLab CI's result for each open pull request's latest commit, as a GitHub check.
              Pipelines that haven't started (manual, skipped, created) show nothing."""
              for pr in pages(gh, "/pulls", {"state": "open"}):
                  mr = newest_mr(pr["number"])
                  if not mr or mr["state"] != "opened":
                      continue
                  pipes = gl("GET", f"/merge_requests/{mr['iid']}/pipelines", params={"per_page": 20}) or []
                  if not pipes:
                      continue
                  pipe = max(pipes, key=lambda p: p["id"])
                  sha = pr["head"]["sha"]
                  if pipe.get("sha") != sha or pipe.get("status") not in CI_STATES:
                      continue
                  state, words = CI_STATES[pipe["status"]]
                  shown = next((s for s in gh("GET", f"/commits/{sha}/statuses", params={"per_page": 100}) or []
                                if s.get("context") == CI_CONTEXT), None)
                  if shown and shown.get("state") == state and shown.get("target_url") == pipe.get("web_url"):
                      continue
                  write(gh, "POST", f"/statuses/{sha}",
                        {"state": state, "context": CI_CONTEXT, "target_url": pipe.get("web_url"),
                         "description": f"Pipeline {pipe['id']} on GitLab {words}"},
                        f"PR {pr['number']}: {CI_CONTEXT} {pipe['status']}")


          # ---------- releases ----------

          def gh_release_copy(rel):
              """A GitHub release this sync made from a GitLab one."""
              return (rel.get("author") or {}).get("login") == GH_BOT and bool(first(rel.get("body"), "gl-release"))


          def sync_releases():
              """Releases published on GitHub, copied to GitLab with links to their files.
              GitHub's release is the source: a GitLab release for the same tag gets its
              name and notes. Only where GitLab has the same tag at the same commit: tags
              are never made or moved here, because the push mirror would overwrite
              GitHub's with them. Copies of GitLab releases stay where they are."""
              rels = [r for r in pages(gh, "/releases") if not r.get("draft") and not gh_release_copy(r)]
              if not rels:
                  return
              on_gl = {r["tag_name"]: r for r in pages(gl, "/releases")}
              for rel in rels:
                  tag = rel["tag_name"]
                  gl_tag = gl("GET", f"/repository/tags/{q(tag)}", missing_ok=True)
                  gh_commit = gh("GET", f"/commits/{q(tag)}", missing_ok=True)
                  if not gl_tag or not gh_commit or (gl_tag.get("commit") or {}).get("id") != gh_commit.get("sha"):
                      print(f"Release {tag}: GitLab doesn't have tag {tag} at the same commit; not copied")
                      continue
                  name = rel.get("name") or tag
                  src = text_hash(f"{name}\0{rel.get('prerelease')}\0{rel.get('body')}")
                  notes = (f"Copied from GitHub: {rel['html_url']}" + ("\n\n**Pre-release.**" if rel.get("prerelease") else "")
                           + "\n\n" + inert(refs(rel.get("body"), "gh")).strip())
                  text = f"{clip(notes)}\n\n{mark('gh-release', rel['id'])}\n{mark('src', src)}"
                  mine = on_gl.get(tag)
                  if (mine and (rel.get("author") or {}).get("login") == GH_BOT
                          and not first(mine.get("description"), "gh-release")):
                      # Most likely a copy of this GitLab release that lost its marker on GitHub.
                      print(f"Release {tag}: GitLab has its own release for this tag; not overwritten")
                      continue
                  if not mine:
                      write(gl, "POST", "/releases", {"tag_name": tag, "name": name, "description": text},
                            f"Release {tag}: copied to GitLab")
                  elif first(mine.get("description"), "src") != src:
                      write(gl, "PUT", f"/releases/{q(tag)}", {"name": name, "description": text},
                            f"Release {tag}: GitLab copy updated")
                  links = {lk["name"]: lk for lk in ((mine or {}).get("assets") or {}).get("links") or []}
                  files = {a["name"]: a["browser_download_url"] for a in rel.get("assets") or []}
                  for fname, url in files.items():
                      have = links.get(fname)
                      if not have:
                          write(gl, "POST", f"/releases/{q(tag)}/assets/links",
                                {"name": fname, "url": url, "link_type": "package"}, f"Release {tag}: link to {fname} added")
                      elif have.get("url") != url:
                          write(gl, "PUT", f"/releases/{q(tag)}/assets/links/{have['id']}", {"url": url},
                                f"Release {tag}: link to {fname} updated")
                  for fname, have in links.items():
                      # Only links to this repo's GitHub downloads are the sync's to remove.
                      if fname not in files and (have.get("url") or "").startswith(f"{GH_WEB}/releases/download/"):
                          write(gl, "DELETE", f"/releases/{q(tag)}/assets/links/{have['id']}", None,
                                f"Release {tag}: link to {fname} removed (gone from GitHub)")


          def gh_tag_commit(tag):
              """The commit GitHub's tag points at, or None if GitHub has no such tag."""
              ref = gh("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe="/"), missing_ok=True)
              obj = ref.get("object") if isinstance(ref, dict) else None
              for _ in range(4):  # an annotated tag points at a tag object first
                  if not obj or obj.get("type") != "tag":
                      break
                  obj = (gh("GET", f"/git/tags/{obj['sha']}", missing_ok=True) or {}).get("object")
              return obj.get("sha") if obj and obj.get("type") == "commit" else None


          def file_link(link):
              """A GitLab release's link to a file, as a Markdown list item (None if it isn't a web link)."""
              url = link.get("direct_asset_url") or link.get("url") or ""
              if not re.match(r"https?://", url):
                  return None
              url = urllib.parse.quote(url, safe=":/?#[]@!$&'*+,;=%~")
              name = re.sub(r"([\\\[\]*_`<>])", r"\\\1", inert(one_line(link.get("name") or "file")))
              return f"- [{name}]({url})"


          def sync_releases_to_gh():
              """Releases made on GitLab, copied to GitHub, and the copy deleted when the GitLab
              release is. GitHub releases can't link to files elsewhere, so a copy lists the
              GitLab release's files in its notes. Only where GitHub has the same tag at the
              same commit (GitHub would make a missing tag itself, and tags belong to the push
              mirror), and never over a release someone made on GitHub."""
              gl_rels = pages(gl, "/releases")
              gh_rels = pages(gh, "/releases")
              copies = [r for r in gh_rels if gh_release_copy(r)]
              if not gl_rels and not copies:
                  return
              theirs = {r["tag_name"] for r in gh_rels if not gh_release_copy(r)}
              mine = {}
              for r in copies:  # one copy per tag: a published one over a draft
                  if r["tag_name"] not in mine or mine[r["tag_name"]].get("draft"):
                      mine[r["tag_name"]] = r
              made = [r for r in gl_rels if not r.get("upcoming_release") and not first(r.get("description"), "gh-release")]
              newest = max(made, key=lambda r: ts(r["released_at"]), default=None)
              now = dt.datetime.now(dt.timezone.utc)
              wait = [90]  # seconds, in all, to wait for the push mirror to bring a new tag over
              latest = []
              for rel in made:
                  tag = rel["tag_name"]
                  if tag in theirs:
                      print(f"Release {tag}: GitHub has its own release for this tag; not copied")
                      continue
                  name = rel.get("name") or tag
                  links = [line for line in map(file_link, (rel.get("assets") or {}).get("links") or []) if line]
                  src = text_hash(json.dumps([name, rel.get("description") or "", links]))
                  have = mine.get(tag)
                  if have and not have.get("draft") and first(have.get("body"), "src") == src:
                      continue
                  commit = (rel.get("commit") or {}).get("id")
                  on_gh = gh_tag_commit(tag)
                  while on_gh is None and wait[0] > 0 and now - ts(rel["created_at"]) < dt.timedelta(minutes=10):
                      print(f"Release {tag}: waiting for the push mirror to bring tag {tag} to GitHub")
                      time.sleep(15)
                      wait[0] -= 15
                      on_gh = gh_tag_commit(tag)
                  if not commit or on_gh != commit:
                      print(f"Release {tag}: GitHub doesn't have tag {tag} at the same commit; not copied")
                      continue
                  url = (rel.get("_links") or {}).get("self") or f"{GL_WEB}/-/releases/{q(tag)}"
                  parts = [f"Copied from GitLab: {url}"]
                  desc = inert(gl_links(refs(rel.get("description"), "gl"))).strip()
                  if desc:
                      parts.append(clip(desc))
                  if links:
                      parts.append("**Files**\n\n" + "\n".join(links))
                  parts.append(f"{mark('gl-release', commit)}\n{mark('src', src)}")
                  text = "\n\n".join(parts)
                  if not have:
                      # The newest GitLab release becomes GitHub's latest, unless GitHub has a newer one
                      # (for a copy, the time its GitLab release came out).
                      if not latest:
                          top = gh("GET", "/releases/latest", missing_ok=True) or {}
                          twin = next((r for r in gl_rels if r["tag_name"] == top.get("tag_name")), None)
                          when = (twin or {}).get("released_at") if gh_release_copy(top) else top.get("published_at")
                          latest.append(ts(when) if when else EPOCH)
                      newer = rel is newest and ts(rel["released_at"]) > latest[0]
                      # target_commitish: if the tag vanished meanwhile, GitHub makes it at the right commit.
                      write(gh, "POST", "/releases",
                            {"tag_name": tag, "target_commitish": commit, "name": name, "body": text,
                             "draft": False, "prerelease": False, "make_latest": "true" if newer else "false"},
                            f"Release {tag}: copied to GitHub")
                  else:
                      body = {"name": name, "body": text}
                      if have.get("draft"):
                          body.update(draft=False, make_latest="false")  # publishing would make it latest
                      write(gh, "PATCH", f"/releases/{have['id']}", body, f"Release {tag}: GitHub copy updated")
              on_gl = {r["tag_name"] for r in gl_rels}
              for r in copies:
                  # Asked again, so a release missing from a list is never deleted by mistake.
                  if r["tag_name"] in on_gl or gl("GET", f"/releases/{q(r['tag_name'])}", missing_ok=True) is not None:
                      continue
                  if r.get("assets"):  # files someone uploaded to the copy would go with it
                      print(f"::warning::Release {r['tag_name']}: gone from GitLab, but its GitHub copy has files"
                            f" uploaded to it, so it is left for you to delete: {r.get('html_url')}")
                      continue
                  write(gh, "DELETE", f"/releases/{r['id']}", None,
                        f"Release {r['tag_name']}: GitHub copy deleted (gone from GitLab)")


          # ---------- modes ----------

          NOT_SWEEPS = {"Sync issues with GitLab (dry run)", "Sync issues with GitLab (backfill)"}


          def last_success(step, since):
              """When the most recent run in which this step succeeded began, looking no further
              back than since and at no more than 8 unsuccessful runs (each costs a request).
              None if there are no runs yet; since (with a warning) if none succeeded. Runs
              from before the steps were split count when the whole run succeeded."""
              try:
                  runs = gh("GET", "/actions/workflows/sync-issues.yml/runs",
                            params={"status": "completed", "per_page": 100}) or {}
              except SystemExit as err:
                  print(f"Can't read earlier runs, so looking back {WINDOW} only: {err}")
                  return None
              seen = looked = 0
              for run in runs.get("workflow_runs") or []:
                  if run.get("display_title") in NOT_SWEEPS or not run.get("run_started_at"):
                      continue
                  began = ts(run["run_started_at"])
                  if began < since:
                      break
                  seen += 1
                  if run.get("conclusion") == "success":
                      return began
                  if looked >= 8:
                      continue
                  looked += 1
                  try:
                      jobs = (gh("GET", f"/actions/runs/{run['id']}/jobs") or {}).get("jobs") or []
                  except SystemExit as err:
                      print(f"Can't read run {run['id']}: {err}")
                      continue
                  if any(st.get("name") == step and st.get("conclusion") == "success"
                         for job in jobs for st in job.get("steps") or []):
                      return began
              if not seen:
                  return None
              print(f"::warning::\"{step}\" hasn't succeeded in the recent runs; catching up from {since:%Y-%m-%d %H:%M} UTC")
              return since


          def window_start(step, longest):
              # From when this step last succeeded (with a margin for clock differences),
              # so nothing changed during an outage is skipped (even a workflow GitHub
              # turned off after 60 quiet days), but no further back than longest.
              now = dt.datetime.now(dt.timezone.utc)
              start = now - WINDOW
              last = last_success(step, now - longest)
              if last and last - dt.timedelta(minutes=10) < start:
                  start = max(last - dt.timedelta(minutes=10), now - longest)
                  print(f"Catching up from {start:%Y-%m-%d %H:%M} UTC (\"{step}\" last succeeded in a run that began {last:%Y-%m-%d %H:%M} UTC)")
              return start.strftime("%Y-%m-%dT%H:%M:%SZ")


          def sweep():
              start = window_start("Issues", dt.timedelta(days=400))
              done = set()

              def pair(number, iid):
                  if (number, iid) not in done:
                      done.add((number, iid))
                      reconcile(number, iid)

              for gli in pages(gl, "/issues", {"updated_after": start, "state": "all", "issue_type": "issue"}):
                  if gli.get("confidential") or gli.get("moved_to_id"):
                      continue
                  number = gl_linked_gh(gli, gl_notes(gli["iid"]))
                  if number is None:
                      if is_gl_bot(gli) or ts(gli["created_at"]) < SINCE:
                          continue
                      number = create_on_gh(gli)
                  if number is not None:
                      pair(number, gli["iid"])

              for ghi in pages(gh, "/issues", {"since": start, "state": "all"}):
                  if "pull_request" in ghi:
                      continue
                  iid = gh_linked_gl(ghi, gh_comments(ghi["number"]))
                  if iid is None:
                      if login(ghi) == GH_BOT or ts(ghi["created_at"]) < SINCE:
                          continue
                      iid = create_on_gl(ghi)
                  if iid is not None:
                      pair(ghi["number"], iid)


          def sweep_pulls():
              """Pull requests touched on either side since this step last succeeded (at most
              two weeks back: each one costs several requests)."""
              start = window_start("Pull requests", dt.timedelta(days=14))
              prs = {i["number"] for i in pages(gh, "/issues", {"since": start, "state": "all"}) if "pull_request" in i}
              for mr in pages(gl, "/merge_requests", {"updated_after": start, "state": "all"}):
                  found = re.fullmatch(r"gh-pr-(\d+)", mr.get("source_branch") or "")
                  if found and own_mr(mr):
                      prs.add(int(found.group(1)))
              for number in sorted(prs):
                  guarded(f"pull request {number}", reconcile_pr, number)


          FAILED = []


          def guarded(what, fn, *args):
              try:
                  fn(*args)
              except (SystemExit, Exception) as err:  # noqa: BLE001 - reported, and the run fails at the end
                  print(f"{what}: {err}")
                  FAILED.append(what)


          def backfill():
              """Link issues the GitHub importer copied: same number, same title."""
              for ghi in pages(gh, "/issues", {"state": "all"}):
                  if "pull_request" in ghi:
                      continue
                  number = ghi["number"]
                  comments = gh_comments(number)
                  if gh_linked_gl(ghi, comments) is not None:
                      print(f"GitHub issue {number}: already linked")
                      continue
                  twin = gl("GET", f"/issues/{number}", missing_ok=True)
                  if not twin or is_gl_bot(twin) or twin["title"].strip() != ghi["title"].strip():
                      print(f"GitHub issue {number}: no GitLab issue with the same number and title; left alone")
                      continue
                  notes = gl_notes(number)
                  if gl_linked_gh(twin, notes) is not None:
                      print(f"GitLab issue {number}: already linked elsewhere; left alone")
                      continue
                  base_gh = max((c["id"] for c in comments), default=0)
                  base_gl = max((n["id"] for n in notes), default=0)
                  write(gl, "POST", f"/issues/{number}/notes",
                        {"body": f"Linked to GitHub: {ghi['html_url']}\n"
                                 f"Imported before issue sync was set up; new comments are copied both ways.\n\n"
                                 f"{mark('gh-issue', number)}\n{mark('baseline-gh', base_gh)}\n"
                                 f"{mark('baseline-gl', base_gl)}"},
                        f"GitLab issue {number}: linked to GitHub issue {number}")


          PART = sys.argv[1] if len(sys.argv) > 1 else "issues"
          if PART == "issues":
              backfill() if MODE == "backfill" else sweep()
              what = MODE
          elif PART == "pulls":
              sweep_pulls()
              what = "pull requests"
          else:
              guarded("CI results", sync_ci)
              guarded("releases from GitHub", sync_releases)
              guarded("releases to GitHub", sync_releases_to_gh)
              what = "CI results and releases"
          summary = f"{what}{' (dry run)' if DRY else ''}: {len(CHANGES)} change(s)"
          if FAILED:
              summary += f"; failed: {', '.join(FAILED)}"
          print(summary)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as out:
              out.write(f"### Issue sync — {summary}\n\n" + "".join(f"- {c}\n" for c in CHANGES))
          if FAILED:
              sys.exit(1)  # so this step doesn't count as having caught up, and the health check sees it
          PY
      - name: Issues
        timeout-minutes: 12
        run: python3 "$RUNNER_TEMP/sync.py" issues
      - name: Pull requests
        if: ${{ !cancelled() && inputs.mode != 'backfill' }}
        timeout-minutes: 8
        run: python3 "$RUNNER_TEMP/sync.py" pulls
      - name: CI results and releases
        if: ${{ !cancelled() && inputs.mode != 'backfill' }}
        timeout-minutes: 4
        run: python3 "$RUNNER_TEMP/sync.py" extras
