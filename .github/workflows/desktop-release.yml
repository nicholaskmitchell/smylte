# Builds what the Windows client installs, so nothing is ever compiled on a
# user's PC. The client reads the rolling `desktop-latest` release rather than
# the repository, which is what makes the exe a thing you install once.
#
# The web job repeats ci.yml's frontend gates on purpose: this workflow can be
# dispatched by hand, and a release that skipped the tests would be a release
# nobody could trust.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client:
        description: >-
          Whether to re-publish Smylte.exe. `auto` (the default, and what a push
          does) publishes it only when desktop/Smylte.Desktop changed since the
          exe on the release was built; `force` publishes it regardless — for a
          change that lives outside that tree, such as the .NET version below.
        type: choice
        options: [auto, force]
        default: auto

# The release tag is ROLLING — every run overwrites the same assets — so two
# pushes in quick succession race, and the slower (older) build can land last and
# become what everyone downloads. ci.yml can race harmlessly; this one publishes.
concurrency:
  group: desktop-release
  cancel-in-progress: false

# Read at workflow scope, write ONLY on `release`. GitHub applies a workflow's
# `permissions:` to every job, so declaring write here handed it to `web` and
# `client` too — and `actions/checkout` defaults `persist-credentials: true`,
# which writes the token into `.git/config` as an `http.extraheader`. The next
# step in `web` is `npm ci`, running install scripts for the whole dependency
# tree. One compromised transitive dev-dependency could read that config and
# publish a release every desktop client executes on next launch.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Nothing after checkout uses git, so the token has no reason to stay on
      # disk while third-party install scripts run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Stamp the build
        # Not read by anything automatically — the client tells builds apart by
        # the release asset's id and updated_at (Updater.cs). This is for a human
        # wondering which commit a running desktop app is actually on.
        run: |
          printf '{"sha":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Package
        run: cd dist && zip -qr "$GITHUB_WORKSPACE/smylte-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: smylte-web.zip
          retention-days: 7

  client:
    runs-on: windows-latest
    steps:
      # Same reasoning as `web`: NuGet restore and MSBuild run restored code,
      # and the restored packages run build targets on the runner.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Same reasoning as `web` running the frontend gates: a release that
      # skipped the tests would be a release nobody could trust. ci.yml runs
      # these too, but ci.yml is a SEPARATE workflow with no dependency edge to
      # this one — on a push to main both fire in parallel, so a red `desktop`
      # job over there does not stop the publish over here, and a
      # `workflow_dispatch` run can publish from a ref where ci.yml never ran at
      # all. `release` needs `client`, so failing here is what actually holds
      # the artifact back.
      - name: Client unit tests
        run: dotnet test desktop/Smylte.Desktop.Tests/Smylte.Desktop.Tests.csproj

      - name: Publish
        run: >
          dotnet publish desktop/Smylte.Desktop/Smylte.Desktop.csproj
          -c Release
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: publish/Smylte.exe
          retention-days: 7

  release:
    needs: [web, client]
    runs-on: ubuntu-latest
    # The one job that publishes, and the only one that needs to write. It runs
    # no dependency install code at all — its steps are `gh` calls over the
    # artifacts the other two built.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a push (no inputs), which the step reads as `auto`.
          CLIENT_PUBLISH: ${{ inputs.client }}
        # Upload --clobber onto the existing release rather than delete-and-recreate,
        # so there is never a window where a client checking for updates finds no
        # release at all.
        #
        # Every api.github.com call here is retried, because this step publishes
        # and it takes more than one call to do it. On 2026-08-17 a 503 hit the
        # notes edit AFTER the assets had uploaded, leaving the rolling release
        # carrying new binaries under notes naming the previous commit — green
        # builds, wrong story, and it took a manual re-run to converge. Retrying
        # is safe because every call below is idempotent: --clobber replaces an
        # asset and --notes replaces the body, so a repeat is a no-op.
        run: |
          # 5 attempts, doubling from 5s: ~75s of cover, which is the shape of a
          # GitHub API blip. A longer outage should fail the job, not sit on a
          # runner — the step is re-runnable and converges when it is.
          retry() {
            local attempt=1 max=5 delay=5
            # Name the call by its first three words, not "$*": the notes are an
            # argument, and echoing them turns every annotation into a paragraph.
            local what="$1 ${2:-} ${3:-}"
            # Annotations go to STDERR. Actions reads them from either stream,
            # and `retry` is used inside `$( )` — on stdout they would be
            # captured as the command's output, which silently corrupts the
            # answer rather than failing. Verified: with these on stdout, a
            # retried existence check returns the warning text instead of
            # "present" and the script falls through to `gh release create`.
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::\`$what\` failed $max times; giving up" >&2
                return 1
              fi
              echo "::warning::\`$what\` failed (attempt $attempt/$max); retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # Whether the release exists is a question the API can also simply fail
          # to answer, and the two must not be confused. `gh release view` exits
          # non-zero for both, so a transient error used to read as "absent" and
          # send the script into `gh release create`, which then died with
          # "already exists" — a misleading error for a retryable blip. Only a
          # real 404 is an answer; anything else propagates and gets retried.
          release_state() {
            local err
            if err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-latest" 2>&1 >/dev/null); then
              echo present
              return 0
            fi
            if printf '%s' "$err" | grep -q 'HTTP 404'; then
              echo absent
              return 0
            fi
            printf '%s\n' "$err" >&2
            return 1
          }

          RELEASE_STATE=$(retry release_state)

          # The web build is published on every run; the exe only when the
          # client's SOURCE changed. A self-contained single-file bundle is not
          # the same bytes twice — the runtime pack and SDK float on `8.0.x`
          # and the bundle carries its own stamps — so re-uploading it on every
          # push gave every push a new digest, and the client (which compares
          # the published digest with its own, Updater.cs) told everyone a new
          # client was available on a README commit. Downloading it changed
          # nothing, because nothing about the window had changed; the web
          # build the client had already swapped in was the whole update.
          #
          # The key is the tree hash of desktop/Smylte.Desktop at HEAD — every
          # source file, the csproj and the icons, and nothing else — recorded
          # in the release notes as "Client source tree" so the next run can
          # read what the published exe was built from. `git rev-parse` reads
          # it off the checkout; a depth-1 clone has HEAD's trees.
          CLIENT_TREE=$(git rev-parse "HEAD:desktop/Smylte.Desktop")

          # Why the exe is being published this run, or empty for "it is not".
          client_reason() {
            if [ "${CLIENT_PUBLISH:-auto}" = force ]; then
              echo "forced by workflow_dispatch"; return 0
            fi
            if [ "$RELEASE_STATE" != present ]; then
              echo "first release"; return 0
            fi
            local names published
            names=$(retry gh release view desktop-latest --json assets --jq '.assets[].name') || return 1
            if ! printf '%s\n' "$names" | grep -qx 'Smylte.exe'; then
              echo "the release has no Smylte.exe"; return 0
            fi
            published=$(retry gh release view desktop-latest --json body --jq .body \
              | sed -n 's/.*Client source tree: \([0-9a-f]\{40\}\).*/\1/p' | head -1) || return 1
            if [ "$published" != "$CLIENT_TREE" ]; then
              echo "client source changed (${published:-unrecorded} -> ${CLIENT_TREE})"; return 0
            fi
            echo ""
          }

          CLIENT_REASON=$(client_reason)
          FILES="artifacts/web/smylte-web.zip"
          if [ -n "$CLIENT_REASON" ]; then
            echo "Publishing Smylte.exe: ${CLIENT_REASON}"
            FILES="$FILES artifacts/client/Smylte.exe"
          else
            echo "Smylte.exe is unchanged (client source tree ${CLIENT_TREE}); not re-published"
          fi

          NOTES="Rolling desktop build from ${GITHUB_SHA}.

          \`Smylte.exe\` is the Windows client — download it once; it keeps its own
          copy of the web build up to date from this release on each launch, and
          the exe here is replaced only when the client itself changed.
          \`smylte-web.zip\` is that web build, and is what the client downloads.

          Client source tree: ${CLIENT_TREE}"

          if [ "$RELEASE_STATE" = present ]; then
            # Assets first, notes second, and the order matters. If this step dies
            # in between, new binaries under stale notes is the harmless half —
            # the client keys on the asset id and updated_at (Updater.cs), never
            # the body, so it still gets the right build. The reverse would leave
            # notes promising a commit whose binaries were never uploaded, which
            # reads as shipped and is not.
            retry gh release upload desktop-latest $FILES --clobber
            retry gh release edit desktop-latest --notes "$NOTES"
          else
            retry gh release create desktop-latest $FILES \
              --title "Smylte desktop (rolling)" \
              --notes "$NOTES" \
              --prerelease
          fi

          # The post-condition, because the failure this step guards against is
          # one that leaves the job looking successful. If the notes do not name
          # the commit whose binaries were just uploaded, the release is in the
          # half-updated state, and that must be a red job rather than something
          # noticed later by reading the releases page.
          BODY=$(retry gh release view desktop-latest --json body --jq .body)
          if ! printf '%s' "$BODY" | grep -q "$GITHUB_SHA"; then
            echo "::error::desktop-latest notes do not name ${GITHUB_SHA}; the release is half-updated"
            exit 1
          fi
          # And the tree the exe was built from, since the next run's decision
          # not to re-publish reads it back from here: notes without it would
          # make the following push upload the exe again, for nothing.
          if ! printf '%s' "$BODY" | grep -q "Client source tree: ${CLIENT_TREE}"; then
            echo "::error::desktop-latest notes do not record the client source tree ${CLIENT_TREE}"
            exit 1
          fi
