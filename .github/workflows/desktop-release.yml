# Builds what the Windows, Linux and Android clients install, so nothing is ever
# compiled on a user's machine. The clients read the rolling `desktop-latest`
# release rather than the repository, which is what makes each of them a thing
# you install once. (The tag predates the Android client and keeps its name:
# every installed client looks it up by that name.)
#
# The web job repeats ci.yml's frontend gates on purpose: this workflow can be
# dispatched by hand, and a release that skipped the tests would be a release
# nobody could trust.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client:
        description: >-
          Whether to re-publish the client binaries. `auto` (the default, and
          what a push does) publishes each only when the sources it is built
          from changed since the copy on the release was built; `force`
          publishes every client regardless — for a change that lives outside
          those trees, such as the .NET or JDK version below.
        type: choice
        options: [auto, force]
        default: auto

# The release tag is ROLLING — every run overwrites the same assets — so two
# pushes in quick succession race, and the slower (older) build can land last and
# become what everyone downloads. ci.yml can race harmlessly; this one publishes.
concurrency:
  group: desktop-release
  cancel-in-progress: false

# Read at workflow scope, write ONLY on `release`. GitHub applies a workflow's
# `permissions:` to every job, so declaring write here handed it to `web` and
# `client` too — and `actions/checkout` defaults `persist-credentials: true`,
# which writes the token into `.git/config` as an `http.extraheader`. The next
# step in `web` is `npm ci`, running install scripts for the whole dependency
# tree. One compromised transitive dev-dependency could read that config and
# publish a release every desktop client executes on next launch.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Nothing after checkout uses git, so the token has no reason to stay on
      # disk while third-party install scripts run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Stamp the build
        # Not read by anything automatically — the client tells builds apart by
        # the release asset's id and updated_at (Updater.cs). This is for a human
        # wondering which commit a running desktop app is actually on.
        run: |
          printf '{"sha":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Package
        run: cd dist && zip -qr "$GITHUB_WORKSPACE/smylte-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: smylte-web.zip
          retention-days: 7

  client:
    runs-on: windows-latest
    steps:
      # Same reasoning as `web`: NuGet restore and MSBuild run restored code,
      # and the restored packages run build targets on the runner.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Same reasoning as `web` running the frontend gates: a release that
      # skipped the tests would be a release nobody could trust. ci.yml runs
      # these too, but ci.yml is a SEPARATE workflow with no dependency edge to
      # this one — on a push to main both fire in parallel, so a red `desktop`
      # job over there does not stop the publish over here, and a
      # `workflow_dispatch` run can publish from a ref where ci.yml never ran at
      # all. `release` needs `client`, so failing here is what actually holds
      # the artifact back.
      - name: Client unit tests
        run: dotnet test desktop/Smylte.Desktop.Tests/Smylte.Desktop.Tests.csproj

      - name: Publish
        run: >
          dotnet publish desktop/Smylte.Desktop/Smylte.Desktop.csproj
          -c Release
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: publish/Smylte.exe
          retention-days: 7

  client-linux:
    # ubuntu, and it needs no GTK to build. GirCore binds by dlopen at RUNTIME,
    # so the only build-time dependency is the SDK — which is what lets this be
    # an ordinary runner and not a container with a desktop stack in it.
    runs-on: ubuntu-latest
    steps:
      # Same reasoning as `web` and `client`: NuGet restore and MSBuild run
      # restored code, and the restored packages run build targets on the runner.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The same gate the Windows client has, and it is not redundant: this leg
      # runs the suite on a CASE-SENSITIVE filesystem, which is the only place
      # LocalServer's traversal guard can be proven, and it takes the
      # derived-key arm of PasswordProtector where the Windows leg takes DPAPI.
      - name: Client unit tests
        run: dotnet test desktop/Smylte.Desktop.Tests/Smylte.Desktop.Tests.csproj

      - name: Publish
        run: >
          dotnet publish desktop/Smylte.Desktop.Linux/Smylte.Desktop.Linux.csproj
          -c Release
          -o publish-linux

      # Whether GirCore's sonames resolve against a REAL WebKitGTK, which is
      # the one thing about this client a runner can answer and the one that
      # breaks silently: a binding that cannot find its library fails at the
      # first call, long after the build is green. It does not prove the app
      # renders — nothing without a compositor can — and the README does not
      # claim it does.
      - name: The bindings resolve against a real WebKitGTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-1 libwebkitgtk-6.0-4 libsoup-3.0-0
          ./publish-linux/Smylte-linux-x86_64 --check

      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: publish-linux/Smylte-linux-x86_64
          retention-days: 7

  client-android:
    # Builds the APK UNSIGNED. The signing key never reaches this job: Gradle
    # runs the Android Gradle Plugin and everything it resolves from Maven,
    # which is third-party build code in exactly the sense `npm ci` is above,
    # and a key that build code could read is a key that could sign anything.
    # `sign-android` applies it with the SDK's own apksigner and nothing else.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # Same reasoning as the jobs above: nothing after checkout uses git.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ./gradlew runs gradle-wrapper.jar before anything else does.
      - name: The Gradle wrapper is Gradle's
        run: ./check-gradle-wrapper.sh

      # The same gate the desktop clients have, for the same reason: `release`
      # needs this job, so failing here is what holds the APK back.
      - name: Unit tests and lint
        run: ./gradlew --no-daemon test lint

      - name: Build
        # The version code has to rise with every published APK, or Android
        # refuses the update as a downgrade. Minutes since 2026-01-01 UTC rises
        # on its own, needs nobody to remember a bump, and stays under
        # Android's ceiling of 2,100,000,000 for about four thousand years.
        # Runs never overlap (the concurrency group above), so two builds can
        # share a minute only by being re-runs of one commit; Android accepts
        # an equal code as an update anyway.
        run: |
          code=$(( ($(date -u +%s) - 1767225600) / 60 ))
          name="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          ./gradlew --no-daemon assembleRelease \
            -PsmylteVersionCode="$code" -PsmylteVersionName="$name"
          cp build/outputs/apk/release/smylte-android-release-unsigned.apk \
            "$GITHUB_WORKSPACE/Smylte-android-unsigned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: client-android-unsigned
          path: Smylte-android-unsigned.apk
          retention-days: 7

  sign-android:
    # The only job that sees the signing key, and it runs no dependency code at
    # all: zipalign and apksigner from the runner's Android SDK, over the APK
    # `client-android` built.
    #
    # Without the two secrets it signs nothing and says so, rather than
    # failing: the web build and the desktop binaries must not stop publishing
    # because the Android key has not been set up yet. android/README.md says
    # how to create them. The key is permanent: Android installs an update only
    # when it is signed with the same key as the installed app.
    needs: client-android
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-android-unsigned

      - name: Sign
        id: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD are not both set, so the Android app is not signed and not published. See android/README.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keystore="$RUNNER_TEMP/smylte-release.p12"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore")

          # AGP aligns what it packages; a signature over an unaligned APK
          # would be refused by the installer, so check rather than assume.
          "$tools/zipalign" -c -P 16 4 Smylte-android-unsigned.apk
          # No --ks-key-alias: the keystore holds one key and apksigner takes
          # it. No v4 signature: that is a sidecar file for streaming installs
          # over adb, and nothing here would publish it.
          "$tools/apksigner" sign \
            --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --v4-signing-enabled false \
            --out Smylte-android.apk Smylte-android-unsigned.apk
          "$tools/apksigner" verify --print-certs Smylte-android.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: client-android
          path: Smylte-android.apk
          retention-days: 7

  release:
    needs: [web, client, client-linux, sign-android]
    runs-on: ubuntu-latest
    # The one job that publishes, and the only one that needs to write. It runs
    # no dependency install code at all — its steps are `gh` calls over the
    # artifacts the other two built.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a push (no inputs), which the step reads as `auto`.
          CLIENT_PUBLISH: ${{ inputs.client }}
          # "true" only when `sign-android` produced a signed APK.
          ANDROID_SIGNED: ${{ needs.sign-android.outputs.signed }}
        # Upload --clobber onto the existing release rather than delete-and-recreate,
        # so there is never a window where a client checking for updates finds no
        # release at all.
        #
        # Every api.github.com call here is retried, because this step publishes
        # and it takes more than one call to do it. On 2026-08-17 a 503 hit the
        # notes edit AFTER the assets had uploaded, leaving the rolling release
        # carrying new binaries under notes naming the previous commit — green
        # builds, wrong story, and it took a manual re-run to converge. Retrying
        # is safe because every call below is idempotent: --clobber replaces an
        # asset and --notes replaces the body, so a repeat is a no-op.
        run: |
          # 5 attempts, doubling from 5s: ~75s of cover, which is the shape of a
          # GitHub API blip. A longer outage should fail the job, not sit on a
          # runner — the step is re-runnable and converges when it is.
          retry() {
            local attempt=1 max=5 delay=5
            # Name the call by its first three words, not "$*": the notes are an
            # argument, and echoing them turns every annotation into a paragraph.
            local what="$1 ${2:-} ${3:-}"
            # Annotations go to STDERR. Actions reads them from either stream,
            # and `retry` is used inside `$( )` — on stdout they would be
            # captured as the command's output, which silently corrupts the
            # answer rather than failing. Verified: with these on stdout, a
            # retried existence check returns the warning text instead of
            # "present" and the script falls through to `gh release create`.
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::\`$what\` failed $max times; giving up" >&2
                return 1
              fi
              echo "::warning::\`$what\` failed (attempt $attempt/$max); retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # Whether the release exists is a question the API can also simply fail
          # to answer, and the two must not be confused. `gh release view` exits
          # non-zero for both, so a transient error used to read as "absent" and
          # send the script into `gh release create`, which then died with
          # "already exists" — a misleading error for a retryable blip. Only a
          # real 404 is an answer; anything else propagates and gets retried.
          release_state() {
            local err
            if err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-latest" 2>&1 >/dev/null); then
              echo present
              return 0
            fi
            if printf '%s' "$err" | grep -q 'HTTP 404'; then
              echo absent
              return 0
            fi
            printf '%s\n' "$err" >&2
            return 1
          }

          RELEASE_STATE=$(retry release_state)

          # The web build is published on every run; the exe only when the
          # client's SOURCE changed. A self-contained single-file bundle is not
          # the same bytes twice — the runtime pack and SDK float on `8.0.x`
          # and the bundle carries its own stamps — so re-uploading it on every
          # push gave every push a new digest, and the client (which compares
          # the published digest with its own, Updater.cs) told everyone a new
          # client was available on a README commit. Downloading it changed
          # nothing, because nothing about the window had changed; the web
          # build the client had already swapped in was the whole update.
          #
          # The key is the tree hash of desktop/Smylte.Desktop at HEAD — every
          # source file, the csproj and the icons, and nothing else — recorded
          # in the release notes as "Client source tree" so the next run can
          # read what the published exe was built from. `git rev-parse` reads
          # it off the checkout; a depth-1 clone has HEAD's trees.
          CLIENT_TREE=$(git rev-parse "HEAD:desktop/Smylte.Desktop")

          # The Linux client needs a key over BOTH trees, because it LINKS the
          # shared sources out of desktop/Smylte.Desktop rather than carrying
          # its own — so a change to LocalServer.cs changes that binary and
          # leaves HEAD:desktop/Smylte.Desktop.Linux untouched. Hashing the two
          # tree hashes together gives one 40-hex value, which keeps the notes
          # line and its scrape exactly the shape the Windows one already has.
          LINUX_TREE=$(git rev-parse "HEAD:desktop/Smylte.Desktop.Linux")
          LINUX_KEY=$(printf '%s %s\n' "$CLIENT_TREE" "$LINUX_TREE" | git hash-object --stdin)

          # The Android client shares no source with the other two, so its key
          # is android/ alone, MINUS the files the APK is not built from: the
          # README, the tests, the wrapper check and .gitignore. Without the
          # exclusions a README typo would tell every phone to update. It is an
          # exclusion list rather than a list of inputs on purpose: forgetting to
          # exclude a file costs one needless update, while forgetting to
          # include one would ship a changed app nobody is told about.
          #
          # pipefail for this one assignment: a failed ls-tree would otherwise
          # hash empty input into a constant and silently stop the APK ever
          # being republished.
          ANDROID_KEY=$(set -o pipefail
            git ls-tree -r HEAD -- android \
              | grep -vE "$(printf '\t')android/(README\.md|\.gitignore|check-gradle-wrapper\.sh|src/test/)" \
              | git hash-object --stdin)

          # Why an asset is being published this run, or empty for "it is not".
          #   $1  the asset's name on the release
          #   $2  the key this run's build was made from
          #   $3  the label the notes record that key under
          #
          # One function for both clients, because the decision is identical and
          # two copies would drift — the exe's half is the one that has already
          # been got wrong once.
          publish_reason() {
            local asset="$1" key="$2" label="$3"
            if [ "${CLIENT_PUBLISH:-auto}" = force ]; then
              echo "forced by workflow_dispatch"; return 0
            fi
            if [ "$RELEASE_STATE" != present ]; then
              echo "first release"; return 0
            fi
            local names published body
            names=$(retry gh release view desktop-latest --json assets --jq '.assets[].name') || return 1
            if ! printf '%s\n' "$names" | grep -qx "$asset"; then
              echo "the release has no $asset"; return 0
            fi
            # Fetched, THEN scraped. `x=$(retry ... | sed | head -1) || return 1`
            # reads as a guarded fetch and is not one: a pipeline's status is
            # its LAST command's, and `head` succeeds on empty input. A run
            # whose body fetch 503'd five times therefore came out with an empty
            # key, which reads as "unrecorded" three lines down — so a dead API
            # call republished both binaries and reported success. The test
            # harness could not see it either, because it ran the step under
            # `pipefail` and the workflow runs under `bash -e` alone.
            body=$(retry gh release view desktop-latest --json body --jq .body) || return 1
            published=$(printf '%s\n' "$body" \
              | sed -n "s/.*${label}: \([0-9a-f]\{40\}\).*/\1/p" | head -1)
            if [ "$published" != "$key" ]; then
              echo "source changed (${published:-unrecorded} -> ${key})"; return 0
            fi
            echo ""
          }

          # The two labels share no words in the order that matters: the exe's
          # scrape looks for "Client source tree" and the Linux one for "Linux
          # client key", so neither pattern can read the other's line whichever
          # order they appear in. A label like "Linux client source tree" would
          # be one capital letter away from being caught by the exe's `.*`.
          CLIENT_REASON=$(publish_reason "Smylte.exe" "$CLIENT_TREE" "Client source tree")
          LINUX_REASON=$(publish_reason "Smylte-linux-x86_64" "$LINUX_KEY" "Linux client key")

          # The APK only exists when `sign-android` had the key. Without it
          # nothing is published and the notes carry no Android line, so the
          # first signed run afterwards reads the key as unrecorded and
          # publishes: once, and harmlessly, if the app had not changed.
          ANDROID_REASON=""
          if [ "${ANDROID_SIGNED:-}" = true ]; then
            ANDROID_REASON=$(publish_reason "Smylte-android.apk" "$ANDROID_KEY" "Android client key")
          else
            echo "::warning::No signed Android build this run; Smylte-android.apk is not published" >&2
          fi

          FILES="artifacts/web/smylte-web.zip"
          if [ -n "$CLIENT_REASON" ]; then
            echo "Publishing Smylte.exe: ${CLIENT_REASON}"
            FILES="$FILES artifacts/client/Smylte.exe"
          else
            echo "Smylte.exe is unchanged (client source tree ${CLIENT_TREE}); not re-published"
          fi
          if [ -n "$LINUX_REASON" ]; then
            echo "Publishing Smylte-linux-x86_64: ${LINUX_REASON}"
            FILES="$FILES artifacts/client-linux/Smylte-linux-x86_64"
          else
            echo "Smylte-linux-x86_64 is unchanged (linux client key ${LINUX_KEY}); not re-published"
          fi
          if [ -n "$ANDROID_REASON" ]; then
            echo "Publishing Smylte-android.apk: ${ANDROID_REASON}"
            FILES="$FILES artifacts/client-android/Smylte-android.apk"
          elif [ "${ANDROID_SIGNED:-}" = true ]; then
            echo "Smylte-android.apk is unchanged (android client key ${ANDROID_KEY}); not re-published"
          fi

          ANDROID_NOTE=""
          if [ "${ANDROID_SIGNED:-}" = true ]; then
            ANDROID_NOTE="
          Android client key: ${ANDROID_KEY}"
          fi

          NOTES="Rolling client build from ${GITHUB_SHA}.

          \`Smylte.exe\` is the Windows client, \`Smylte-linux-x86_64\` the Linux
          one and \`Smylte-android.apk\` the Android one — download one once; it
          keeps its own copy of the web build up to date from this release, and
          the binary here is replaced only when that client itself changed.
          \`smylte-web.zip\` is that web build, and is what every client downloads.

          The Linux client needs GTK 4 and WebKitGTK 6 from your distribution
          (\`sudo dnf install gtk4 webkitgtk6.0\` on Fedora) and \`chmod +x\` after
          a manual download; it says so itself if either is missing.

          The Android app is installed by opening the APK on the phone and
          allowing your browser or file manager to install apps; after that it
          updates itself. It is not in any app store.

          Client source tree: ${CLIENT_TREE}
          Linux client key: ${LINUX_KEY}${ANDROID_NOTE}"

          if [ "$RELEASE_STATE" = present ]; then
            # Assets first, notes second, and the order matters. If this step dies
            # in between, new binaries under stale notes is the harmless half —
            # the client keys on the asset id and updated_at (Updater.cs), never
            # the body, so it still gets the right build. The reverse would leave
            # notes promising a commit whose binaries were never uploaded, which
            # reads as shipped and is not.
            retry gh release upload desktop-latest $FILES --clobber
            retry gh release edit desktop-latest --notes "$NOTES"
          else
            retry gh release create desktop-latest $FILES \
              --title "Smylte desktop (rolling)" \
              --notes "$NOTES" \
              --prerelease
          fi

          # The post-condition, because the failure this step guards against is
          # one that leaves the job looking successful. If the notes do not name
          # the commit whose binaries were just uploaded, the release is in the
          # half-updated state, and that must be a red job rather than something
          # noticed later by reading the releases page.
          BODY=$(retry gh release view desktop-latest --json body --jq .body)
          if ! printf '%s' "$BODY" | grep -q "$GITHUB_SHA"; then
            echo "::error::desktop-latest notes do not name ${GITHUB_SHA}; the release is half-updated"
            exit 1
          fi
          # And the keys each client was built from, since the next run's
          # decision not to re-publish reads them back from here: notes without
          # one would make the following push upload that binary again, for
          # nothing. Both, because a half-written body is exactly the state this
          # post-condition exists to catch.
          if ! printf '%s' "$BODY" | grep -q "Client source tree: ${CLIENT_TREE}"; then
            echo "::error::desktop-latest notes do not record the client source tree ${CLIENT_TREE}"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -q "Linux client key: ${LINUX_KEY}"; then
            echo "::error::desktop-latest notes do not record the linux client key ${LINUX_KEY}"
            exit 1
          fi
          if [ "${ANDROID_SIGNED:-}" = true ] \
            && ! printf '%s' "$BODY" | grep -q "Android client key: ${ANDROID_KEY}"; then
            echo "::error::desktop-latest notes do not record the android client key ${ANDROID_KEY}"
            exit 1
          fi
