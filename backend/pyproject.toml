[project]
name = "tasksd"
version = "0.0.0"
description = "TickTick-equivalent task manager backed by Radicale CalDAV"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "radicale: integration tests that require the scratch Radicale on :5233",
    # The audit backlog, staged. Each finding got a test asserting the CORRECT
    # behaviour, written and confirmed to fail BEFORE the fix — originally as
    # `xfail(strict=True)`, so CI stayed green while the bug was open and went
    # red the moment it was fixed and the pin needed reclassifying. The backlog
    # is now closed and no xfail marker remains: these are ordinary regression
    # tests that must stay green. Run one stage with `pytest -m stage1`; see
    # docs/STAGES.md.
    "backlog: a regression test for a finding from an audit sweep (docs/AUDIT.md)",
    "stage1: crash paths — untrusted input reaching an unhandled exception",
    "stage2: abuse and resource exhaustion",
    "stage3: silent data corruption and wrong results",
    "stage4: user-visible correctness and rendering",
    "stage5: delivery infrastructure and test gaps",
]
