<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Light by default; the pre-paint script below (and App on toggle) flips
         it to dark so mobile browser chrome matches the theme. -->
    <meta name="theme-color" content="#FBFAF7" />
    <title>Smylte — Tasks &amp; Calendar</title>
    <!-- SVG for modern browsers; PNG fallback for those that won't render an SVG
         tab icon (e.g. older Safari). ?v= busts aggressive favicon caching. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply persisted theme + appearance overrides before paint (no flash) —
      // Søren's pattern, extended for custom themes.
      //
      // This runs before the bundle, so it cannot import src/appearance.ts and
      // has to restate the token list and the value guard inline. Both are
      // asserted against the real ones by src/appearance.test.ts, which fails
      // the build if the two copies drift.
      //
      // The guard is not decoration: localStorage is writable by anything that
      // ever gets script execution on this origin, and these values go straight
      // into the CSSOM. Only known token names are honoured, and only values
      // free of url()/braces/semicolons and under 120 chars.
      (function () {
        var TOKENS = [
          '--bg', '--bg-elev', '--paper', '--fg', '--fg-muted', '--fg-faint',
          '--rule', '--rule-faint', '--accent', '--warn', '--ok',
          '--pri-high', '--pri-med', '--pri-low',
          '--serif', '--sans', '--mono',
          '--radius', '--fs-scale', '--gutter', '--row-y'
        ]
        var BAD = /url\(|image\(|expression\(|javascript:|@import|[;{}<>\\]|\/\*/i
        var root = document.documentElement
        var mode = 'light'
        try {
          var t = localStorage.getItem('tasks-theme')
          if (t === 'dark' || t === 'light') { root.dataset.theme = t; mode = t }
        } catch (_) {}
        // tokens.css is imported by the bundle, so nothing is in the cascade yet
        // and getComputedStyle('--bg') would come back empty here. Carry the two
        // shipped backgrounds instead, and let a custom --bg override them.
        var bg = mode === 'dark' ? '#0C0C10' : '#FBFAF7'
        try {
          var raw = localStorage.getItem('tasks-appearance')
          if (raw) {
            var a = JSON.parse(raw)
            var themes = (a && a.themes) || []
            for (var i = 0; i < themes.length; i++) {
              if (!themes[i] || themes[i].id !== a.active) continue
              var map = themes[i][mode] || {}
              for (var k = 0; k < TOKENS.length; k++) {
                var v = map[TOKENS[k]]
                if (typeof v === 'string' && v && v.length <= 120 && !BAD.test(v)) {
                  root.style.setProperty(TOKENS[k], v)
                  if (TOKENS[k] === '--bg') bg = v
                }
              }
              break
            }
          }
        } catch (_) {}
        try {
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bg)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
